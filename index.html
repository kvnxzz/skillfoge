<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillForge - SIH Dashboard</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        vercel: {
                            black: '#000000',
                            dark: '#0a0a0a',
                            border: '#333333',
                            gray: '#888888',
                        }
                    },
                    boxShadow: {
                        'emerald-glow': '0 0 15px rgba(16, 185, 129, 0.15)',
                        'emerald-glow-strong': '0 0 25px rgba(16, 185, 129, 0.4)',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000; color: #fff; }
        /* Custom scrollbar for terminal */
        .terminal-scroll::-webkit-scrollbar { width: 6px; }
        .terminal-scroll::-webkit-scrollbar-track { background: transparent; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .terminal-scroll::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- MOCK DATA ---
        const MOCK_UNIVERSITIES = [
            { id: 1, name: "All India Institute of Ayurveda", domain: "Ayush/Bio-Tech", drift: 12, sync: 'Synced' },
            { id: 2, name: "IIT Bombay", domain: "Core Engineering", drift: 45, sync: 'Pending' },
            { id: 3, name: "National Institute of Siddha", domain: "Ayush/Bio-Tech", drift: 8, sync: 'Synced' },
            { id: 4, name: "NIT Trichy", domain: "Software Tracks", drift: 28, sync: 'Failed' },
        ];

        const MOCK_MEMBERS = [
            { id: 1, name: "Aditi Sharma", role: "Ayush Integration Lead", commits: 1243, sha: "a1b2c3d4e5f6...8x9y0" },
            { id: 2, name: "Rahul Verma", role: "Backend Architect", commits: 3890, sha: "f5e4d3c2b1a0...1z2x3" },
            { id: 3, name: "Dr. Nair", role: "Syllabus Compliance Admin", commits: 45, sha: "9m8n7b6v5c4x...3z2a1" },
        ];

        const MOCK_STUDENT = {
            name: "Priya Patel",
            institution: "All India Institute of Ayurveda",
            skills: ["Ayurvedic Pharmacopoeia", "Python", "Data Analysis", "Clinical Research"],
            jobs: [
                { title: "Ayush HealthTech Data Analyst", company: "CureFit Ministry Track", match: "95%" },
                { title: "Bio-Informatics Intern", company: "Bharat Biotech", match: "88%" },
                { title: "Digital Health Associate", company: "National Health Authority", match: "82%" }
            ]
        };

        // --- COMPONENTS ---

        // 1. Authentication Portal
        const LoginPortal = ({ onLogin }) => {
            const [role, setRole] = useState('manager');
            const [username, setUsername] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                onLogin({ role, username: username || 'User' });
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-vercel-black bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-900/40 via-vercel-black to-vercel-black px-4">
                    <div className="w-full max-w-md bg-white/[0.02] border border-white/10 rounded-2xl p-8 backdrop-blur-xl shadow-emerald-glow transition-all duration-500 hover:shadow-emerald-glow-strong">
                        <div className="flex justify-center mb-8">
                            <div className="w-12 h-12 rounded-xl bg-emerald-500/20 border border-emerald-500/50 flex items-center justify-center shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                                <span className="text-emerald-400 font-bold text-xl">SF</span>
                            </div>
                        </div>
                        <h2 className="text-2xl font-semibold text-center mb-2 tracking-tight">SkillForge Access</h2>
                        <p className="text-gray-400 text-center text-sm mb-8">Smart India Hackathon Portal</p>
                        
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Access Role</label>
                                <select 
                                    value={role} 
                                    onChange={(e) => setRole(e.target.value)}
                                    className="w-full bg-vercel-dark border border-vercel-border text-white rounded-lg px-4 py-2.5 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all appearance-none"
                                >
                                    <option value="manager">System Manager (Admin)</option>
                                    <option value="student">Student Portal</option>
                                    <option value="university">Institution Node</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Identifier / Token</label>
                                <input 
                                    type="text" 
                                    placeholder="Enter your credentials"
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                    className="w-full bg-vercel-dark border border-vercel-border text-white rounded-lg px-4 py-2.5 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all placeholder-gray-600"
                                    required
                                />
                            </div>
                            <button type="submit" className="w-full bg-white text-black font-medium py-2.5 rounded-lg hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-black transition-all transform hover:scale-[1.02]">
                                Authenticate
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // 2. Student Dashboard
        const StudentDashboard = ({ user, onLogout }) => (
            <div className="min-h-screen bg-vercel-black p-8">
                <Header title={`Student Portal: ${user.username}`} onLogout={onLogout} />
                <div className="max-w-6xl mx-auto mt-8 grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-1 space-y-6">
                        <div className="bg-white/[0.02] border border-white/10 rounded-xl p-6 backdrop-blur-md">
                            <h3 className="text-lg font-medium mb-4">Profile</h3>
                            <p className="text-sm text-gray-400">Name: <span className="text-white">{MOCK_STUDENT.name}</span></p>
                            <p className="text-sm text-gray-400 mt-2">Node: <span className="text-white">{MOCK_STUDENT.institution}</span></p>
                        </div>
                        <div className="bg-white/[0.02] border border-white/10 rounded-xl p-6 backdrop-blur-md">
                            <h3 className="text-lg font-medium mb-4">Verified Skills</h3>
                            <div className="flex flex-wrap gap-2">
                                {MOCK_STUDENT.skills.map(skill => (
                                    <span key={skill} className="px-3 py-1 bg-vercel-dark border border-vercel-border rounded-full text-xs text-gray-300">
                                        {skill}
                                    </span>
                                ))}
                            </div>
                        </div>
                    </div>
                    <div className="lg:col-span-2 bg-white/[0.02] border border-white/10 rounded-xl p-6 backdrop-blur-md hover:shadow-emerald-glow transition-shadow duration-300">
                        <h3 className="text-lg font-medium mb-6 flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            AI Job Recommendations
                        </h3>
                        <div className="space-y-4">
                            {MOCK_STUDENT.jobs.map((job, idx) => (
                                <div key={idx} className="p-4 bg-vercel-dark border border-vercel-border rounded-lg flex justify-between items-center group hover:border-emerald-500/50 transition-all cursor-pointer">
                                    <div>
                                        <h4 className="font-medium text-white group-hover:text-emerald-400 transition-colors">{job.title}</h4>
                                        <p className="text-sm text-gray-400 mt-1">{job.company}</p>
                                    </div>
                                    <div className="text-right">
                                        <span className="text-emerald-400 font-mono text-sm">{job.match} Match</span>
                                        <button className="block mt-2 text-xs bg-white/10 hover:bg-white/20 px-3 py-1 rounded transition-colors">Apply Now</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </div>
        );

        // 3. Manager Dashboard (Main Request)
        const ManagerDashboard = ({ user, onLogout }) => {
            const [activeTab, setActiveTab] = useState('controller');
            
            return (
                <div className="min-h-screen bg-vercel-black">
                    <Header title="SkillForge Management Console" onLogout={onLogout} />
                    
                    <div className="max-w-7xl mx-auto px-6 py-8">
                        {/* Tab Navigation */}
                        <div className="flex space-x-1 border-b border-white/10 mb-8">
                            {[
                                { id: 'controller', label: 'Website Controller' },
                                { id: 'university', label: 'University Manager' },
                                { id: 'members', label: 'Members & Access' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`px-5 py-3 text-sm font-medium transition-all relative ${activeTab === tab.id ? 'text-white' : 'text-gray-500 hover:text-gray-300'}`}
                                >
                                    {tab.label}
                                    {activeTab === tab.id && (
                                        <div className="absolute bottom-[-1px] left-0 w-full h-[2px] bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.8)]"></div>
                                    )}
                                </button>
                            ))}
                        </div>

                        {/* Content Area */}
                        <div className="animate-fade-in">
                            {activeTab === 'controller' && <ControllerPanel />}
                            {activeTab === 'university' && <UniversityPanel />}
                            {activeTab === 'members' && <MembersPanel />}
                        </div>
                    </div>
                </div>
            );
        };

        // --- SUB-PANELS FOR MANAGER ---

        const ControllerPanel = () => {
            const [portalName, setPortalName] = useState('SkillForge Alpha v1.0');
            const [logs, setLogs] = useState(['[SYSTEM] Initializing SIH Dashboard...', '[AUTH] Identity verified via SHA-256.', '[API] Connected to Ministry of Ayush endpoints.']);
            const endOfLogsRef = useRef(null);

            useEffect(() => {
                const interval = setInterval(() => {
                    const endpoints = ['/api/ayush/sync', '/auth/validate', '/repo/github/webhook', '/metrics/drift-score'];
                    const statuses = ['200 OK', '201 CREATED', '200 OK', 'WARN - Payload High'];
                    const random = Math.floor(Math.random() * endpoints.length);
                    const timestamp = new Date().toISOString().split('T')[1].slice(0, 8);
                    
                    setLogs(prev => {
                        const newLogs = [...prev, `[${timestamp}] GET ${endpoints[random]} - ${statuses[random]}`];
                        return newLogs.slice(-15); // Keep last 15
                    });
                }, 2500);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                endOfLogsRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [logs]);

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div className="bg-white/[0.02] border border-white/10 rounded-xl p-6 backdrop-blur-md">
                        <h3 className="text-lg font-medium mb-6">Portal Configuration</h3>
                        <div className="space-y-6">
                            <div>
                                <label className="block text-xs font-medium text-gray-400 mb-2">Portal Name</label>
                                <input 
                                    type="text" 
                                    value={portalName}
                                    onChange={(e) => setPortalName(e.target.value)}
                                    className="w-full bg-vercel-dark border border-vercel-border text-white rounded-lg px-4 py-2 focus:outline-none focus:border-emerald-500 transition-colors"
                                />
                            </div>
                            
                            <div className="space-y-4 pt-4 border-t border-white/10">
                                <label className="block text-xs font-medium text-gray-400">Automation Pipelines</label>
                                {[
                                    { id: 'p1', label: 'Auto-sync Ayush Pharmacopoeia DB', active: true },
                                    { id: 'p2', label: 'Corporate Track Job Matcher AI', active: true },
                                    { id: 'p3', label: 'Strict Rate Limiting (DDoS protect)', active: false },
                                ].map(pipe => (
                                    <div key={pipe.id} className="flex items-center justify-between p-3 bg-vercel-dark rounded-lg border border-vercel-border hover:border-emerald-500/30 transition-all">
                                        <span className="text-sm text-gray-300">{pipe.label}</span>
                                        <label className="relative inline-flex items-center cursor-pointer">
                                            <input type="checkbox" className="sr-only peer" defaultChecked={pipe.active} />
                                            <div className="w-9 h-5 bg-gray-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500 shadow-inner"></div>
                                        </label>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="bg-vercel-dark border border-vercel-border rounded-xl flex flex-col h-96 shadow-lg shadow-black/50 overflow-hidden relative">
                        <div className="bg-[#1a1a1a] border-b border-[#333] px-4 py-2 flex items-center gap-2">
                            <div className="flex gap-1.5">
                                <div className="w-3 h-3 rounded-full bg-red-500/80"></div>
                                <div className="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                                <div className="w-3 h-3 rounded-full bg-green-500/80"></div>
                            </div>
                            <span className="text-xs text-gray-400 font-mono ml-2">sys-console @ skillforge-production</span>
                        </div>
                        <div className="flex-1 p-4 overflow-y-auto terminal-scroll font-mono text-sm leading-relaxed">
                            {logs.map((log, i) => (
                                <div key={i} className={`${log.includes('WARN') ? 'text-yellow-400' : 'text-emerald-400'} mb-1`}>
                                    <span className="text-gray-500 select-none mr-2">❯</span>
                                    {log}
                                </div>
                            ))}
                            <div ref={endOfLogsRef} />
                        </div>
                    </div>
                </div>
            );
        };

        const UniversityPanel = () => {
            return (
                <div className="bg-white/[0.02] border border-white/10 rounded-xl overflow-hidden backdrop-blur-md shadow-lg">
                    <div className="p-6 border-b border-white/10 flex justify-between items-center">
                        <div>
                            <h3 className="text-lg font-medium">Academic Nodes</h3>
                            <p className="text-sm text-gray-400 mt-1">Manage institutional synchronization and syllabus tracking.</p>
                        </div>
                        <button className="bg-white text-black px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">
                            + Register Node
                        </button>
                    </div>
                    
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="border-b border-white/10 text-xs uppercase tracking-wider text-gray-400 bg-vercel-dark/50">
                                    <th className="p-4 font-medium">Institution Name</th>
                                    <th className="p-4 font-medium">Domain Focus</th>
                                    <th className="p-4 font-medium w-1/3">Syllabus Drift Score</th>
                                    <th className="p-4 font-medium">Sync Status</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-white/5">
                                {MOCK_UNIVERSITIES.map(uni => (
                                    <tr key={uni.id} className="hover:bg-white/[0.02] transition-colors group">
                                        <td className="p-4">
                                            <div className="font-medium text-white group-hover:text-emerald-400 transition-colors">{uni.name}</div>
                                        </td>
                                        <td className="p-4 text-sm text-gray-300">
                                            <span className="px-2.5 py-1 rounded-md border border-white/10 bg-white/5">
                                                {uni.domain}
                                            </span>
                                        </td>
                                        <td className="p-4">
                                            <div className="flex items-center gap-3">
                                                <div className="flex-1 h-2 bg-gray-800 rounded-full overflow-hidden">
                                                    <div 
                                                        className={`h-full rounded-full transition-all duration-1000 ease-out ${
                                                            uni.drift > 30 ? 'bg-red-500' : uni.drift > 15 ? 'bg-yellow-500' : 'bg-emerald-500'
                                                        }`}
                                                        style={{ width: `${Math.min(100, 100 - uni.drift)}%` }}
                                                    ></div>
                                                </div>
                                                <span className="text-xs font-mono w-8 text-right">{uni.drift}%</span>
                                            </div>
                                        </td>
                                        <td className="p-4">
                                            <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs border ${
                                                uni.sync === 'Synced' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                                                uni.sync === 'Pending' ? 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20' :
                                                'bg-red-500/10 text-red-400 border-red-500/20'
                                            }`}>
                                                <div className={`w-1.5 h-1.5 rounded-full ${
                                                    uni.sync === 'Synced' ? 'bg-emerald-500' :
                                                    uni.sync === 'Pending' ? 'bg-yellow-500' : 'bg-red-500'
                                                }`}></div>
                                                {uni.sync}
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const MembersPanel = () => {
            return (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {MOCK_MEMBERS.map(member => (
                        <div key={member.id} className="bg-white/[0.02] border border-white/10 rounded-xl p-5 backdrop-blur-md hover:border-white/20 transition-all duration-300 hover:-translate-y-1 hover:shadow-emerald-glow group">
                            <div className="flex justify-between items-start mb-4">
                                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-gray-700 to-vercel-dark border border-white/10 flex items-center justify-center text-sm font-bold">
                                    {member.name.split(' ').map(n=>n[0]).join('')}
                                </div>
                                <button className="text-gray-500 hover:text-white transition-colors">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
                                </button>
                            </div>
                            
                            <h4 className="text-lg font-medium text-white group-hover:text-emerald-400 transition-colors">{member.name}</h4>
                            <p className="text-sm text-gray-400 mb-6">{member.role}</p>
                            
                            <div className="space-y-3 mb-6">
                                <div className="flex justify-between text-xs">
                                    <span className="text-gray-500">GitHub Telemetry</span>
                                    <span className="text-white font-mono">{member.commits} commits</span>
                                </div>
                                <div className="flex justify-between text-xs">
                                    <span className="text-gray-500">Auth Token</span>
                                    <span className="text-emerald-400/80 font-mono text-[10px] truncate w-24" title={member.sha}>{member.sha}</span>
                                </div>
                            </div>
                            
                            <div className="flex gap-2">
                                <button className="flex-1 bg-white/5 hover:bg-white/10 border border-white/10 text-white text-xs font-medium py-2 rounded-lg transition-all focus:ring-2 focus:ring-emerald-500/50">
                                    Edit Role
                                </button>
                                <button className="flex-1 bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 text-red-400 text-xs font-medium py-2 rounded-lg transition-all">
                                    Revoke
                                </button>
                            </div>
                        </div>
                    ))}
                    
                    {/* Add Member Card */}
                    <div className="bg-vercel-dark border border-dashed border-vercel-border rounded-xl p-5 flex flex-col items-center justify-center text-gray-500 hover:text-white hover:border-white/30 transition-all cursor-pointer min-h-[280px]">
                        <svg className="w-8 h-8 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 4v16m8-8H4" />
                        </svg>
                        <span className="text-sm font-medium">Invite Team Member</span>
                    </div>
                </div>
            );
        };

        // --- SHARED COMPONENTS ---
        const Header = ({ title, onLogout }) => (
            <header className="max-w-7xl mx-auto px-6 py-6 flex justify-between items-center border-b border-white/10">
                <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/50 flex items-center justify-center shadow-[0_0_10px_rgba(16,185,129,0.3)]">
                        <span className="text-emerald-400 font-bold text-xs">SF</span>
                    </div>
                    <h1 className="font-semibold text-lg tracking-tight">{title}</h1>
                </div>
                <button 
                    onClick={onLogout}
                    className="text-sm text-gray-400 hover:text-white border border-transparent hover:border-white/10 px-3 py-1.5 rounded-md transition-all"
                >
                    Disconnect
                </button>
            </header>
        );

        // --- MAIN APP ---
        const App = () => {
            const [user, setUser] = useState(null);

            if (!user) {
                return <LoginPortal onLogin={setUser} />;
            }

            if (user.role === 'student') {
                return <StudentDashboard user={user} onLogout={() => setUser(null)} />;
            }

            if (user.role === 'university') {
                return (
                    <div className="min-h-screen bg-vercel-black">
                        <Header title="Institution Node View" onLogout={() => setUser(null)} />
                        <div className="max-w-7xl mx-auto p-8 text-center text-gray-400 mt-20">
                            <h2 className="text-2xl text-white mb-2">Welcome, {user.username}</h2>
                            <p>Institution dashboard is running in reduced mode.</p>
                            <p className="mt-8 text-sm">Please switch to Manager view to see full capabilities as requested.</p>
                        </div>
                    </div>
                );
            }

            // Default: Manager
            return <ManagerDashboard user={user} onLogout={() => setUser(null)} />;
        };

        // Render React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
